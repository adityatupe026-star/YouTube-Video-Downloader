<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SPOOL start screen</title><desc id="desc">Dark SPOOL downloader interface with API server and YouTube link inputs.</desc>
  <defs><radialGradient id="bg" cx="50%" cy="0%" r="75%"><stop stop-color="#28334b"/><stop offset=".52" stop-color="#0a0d14"/></radialGradient></defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="360" y="125" fill="#e8a33d" font-size="18" font-weight="700" letter-spacing="3">VIDEO + AUDIO ARCHIVER</text>
    <text x="360" y="205" fill="#f3f0e8" font-size="74" font-weight="800" letter-spacing="5">SPOOL</text>
    <text x="360" y="247" fill="#9ca5bc" font-size="24">Paste one video or a complete YouTube playlist.</text>
    <rect x="360" y="294" width="720" height="380" rx="18" fill="#151a2a" stroke="#2b3450" stroke-width="2"/>
    <text x="394" y="350" fill="#9ca5bc" font-size="15" font-weight="700" letter-spacing="1">API SERVER</text>
    <rect x="394" y="370" width="652" height="55" rx="9" fill="#0e1321" stroke="#2b3450"/>
    <text x="414" y="405" fill="#f3f0e8" font-size="20">http://127.0.0.1:8000</text>
    <text x="394" y="477" fill="#9ca5bc" font-size="15" font-weight="700" letter-spacing="1">YOUTUBE VIDEO OR PLAYLIST LINK</text>
    <rect x="394" y="497" width="496" height="55" rx="9" fill="#0e1321" stroke="#2b3450"/>
    <text x="414" y="532" fill="#9ca5bc" font-size="18">https://www.youtube.com/playlist?list=…</text>
    <rect x="900" y="497" width="146" height="55" rx="9" fill="#e8a33d"/>
    <text x="926" y="532" fill="#201708" font-size="18" font-weight="800">LOAD</text>
    <text x="394" y="605" fill="#9ca5bc" font-size="16">Playlist downloads are saved as one ZIP file. Only download content</text>
    <text x="394" y="630" fill="#9ca5bc" font-size="16">you have permission to save.</text>
  </g>
</svg>
